     inkscape:current-layer="svg4" /><!-- OLMP-V1.2C board mount, laser cut, 5mm black acrylic
       (project default, 0029). Board measured directly by user:
       20mm x 20mm square, 2x M3 bolts (2.8mm measured) 15.5mm
       center-to-center, board bolts THROUGH into this plate
       (no separate board-side holes - the board's own 2 bolts
       are the mounting posts).

       Plate: 40mm x 30mm, board holes centered in the upper
       portion, 2x slotted holes at the bottom for T-slot
       mounting to 2020/2040 extrusion (slotted for position
       adjustment, matching this project's usual approach for
       not-yet-finalized mounting locations).

       Units: mm. 1 SVG unit = 1mm. Cut lines only, no fill. --><!-- Scale bar for import verification: 100mm x 10mm --><rect
