<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="240mm" viewBox="0 0 320 240">
  <!-- Gantry end cap: replaces gantry-end-plate-fixed.svg / -floating.svg entirely.
       See ADR 0036. Used 4x per machine (front + back plate, at each of the
       2 beam ends) -- all four are the same design, cut from this one file. -->
  <!-- Beam attachment zone (top): 2 L-bracket slots (this plate's own facing
       wide face only -- the OTHER plate in the front/back pair uses the
       beam's other wide face) + 1 tapped-screw clearance hole for the
       extrusion's end-bore mounting screw. No flared opening needed --
       both ends are now solid/precise since beam-length tolerance is
       absorbed at the frame's own corner joint instead (ADR 0035). -->
  <!-- Straddle zone (middle): extends down past the 1200mm frame rail's
       position to reach the carriage block. WORKING ESTIMATE length --
       verify against actual beam/rail/carriage stack-up before cutting. -->
  <!-- Carriage attachment zone (bottom): standard MGN12H 20x20mm M3 pattern,
       same as used throughout this build (ADR 0013). -->
  <!-- Units: mm. 1 SVG user unit = 1mm. Cut lines only (no fill) for laser import.
       Material: 3mm black acrylic per layer, 2 layers laminated (ADR 0036,
       a deliberate exception to ADR 0029's general 5mm rule). -->

  <!-- INNER LAYER -->
  <g transform="translate(10,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">End cap - INNER layer (L-bracket slots)</text>
    <rect x="0" y="0" width="70" height="200" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- Tapped-screw clearance hole: extrusion end-bore mounting screw -->
    <circle cx="35" cy="8" r="2.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- L-bracket slots: 10mm wide x 22mm deep, 20mm apart, at the top edge
         (reusing the fixed-plate slot geometry from the superseded 0016
         design -- no flare needed since this end no longer absorbs tolerance) -->
    <rect x="20" y="0" width="10" height="22" fill="none" stroke="#000000" stroke-width="0.1" />
    <rect x="40" y="0" width="10" height="22" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- Set-screw access holes, mid-slot-depth -->
    <circle cx="25" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="45" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- Carriage mount holes: M3 clearance, 20x20mm pattern, near the bottom -->
    <circle cx="25" cy="180" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="45" cy="180" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="25" cy="200" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="45" cy="200" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- OUTER LAYER (solid backing, no L-bracket cutouts -- shared design, cut 4x total per plate too) -->
  <g transform="translate(110,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">End cap - OUTER layer (solid backing)</text>
    <rect x="0" y="0" width="70" height="200" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="8" r="2.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="25" cy="180" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="45" cy="180" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="25" cy="200" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="45" cy="200" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- Scale bar for import verification: 100mm x 10mm -->
  <rect x="10" y="220" width="100" height="10" fill="none" stroke="#000000" stroke-width="0.1" />
  <text x="10" y="236" font-family="sans-serif" font-size="5" fill="#000000">100mm x 10mm scale bar</text>
</svg>
