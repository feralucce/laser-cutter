<svg xmlns="http://www.w3.org/2000/svg" width="280mm" height="140mm" viewBox="0 0 280 140">
  <!-- Fixed/reference gantry end plate: joins the Y-axis beam to the X-axis
       carriage. Two laminated layers. X-rail is mounted wide-face-vertical
       (narrow face up) for rigidity, so this plate installs rotated 90° from
       a flat "shelf" orientation -- carriage-mount holes face sideways
       toward the carriage, not straight down. See ADR 0016. -->
  <!-- Inner layer: faces the beam/L-brackets. Beam end is precision-cut to butt flush
       against the top edge, so no wide flared opening is needed here (unlike the
       floating plate) -- just the two narrow slots replicating the extrusion's
       T-slot channels for the bracket legs. Outer layer: solid backing + shared
       carriage mount holes, identical to the floating plate's outer layer. -->
  <!-- Units: mm. 1 SVG user unit = 1mm. Cut lines only (no fill) for laser import. -->
  <!-- Working dims: bracket leg ~19-20mm, M5 set screw -- verify against actual
       hardware before cutting. Assumed material: 6mm ply/acrylic per layer. -->

  <!-- INNER LAYER -->
  <g transform="translate(10,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">Fixed plate - INNER layer</text>
    <polygon fill="none" stroke="#000000" stroke-width="0.1" points="
      0,0 10,0 10,22 20,22 20,0 30,0 30,22 40,22 40,0 50,0 50,95 0,95 0,0" />
    <!-- Carriage mount holes: M3 clearance, 20x20mm pattern -->
    <circle cx="15" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- L-bracket set screw access holes: centered in each slot's depth -->
    <circle cx="15" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- OUTER LAYER (shared design, same as floating plate's outer layer) -->
  <g transform="translate(90,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">Outer layer (shared, cut 2x)</text>
    <rect x="0" y="0" width="50" height="95" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- L-bracket set screw access holes (both slot-depth positions, since this
         shared outer layer design is reused for the floating plate too) -->
    <circle cx="15" cy="29" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="29" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="11" r="2.5" fill="none" stroke="#000000" stroke-width="0.1" />
    <!-- Belt clamp mounting holes: M4 clearance (4.5mm dia), one per belt end,
         positioned in the left/right margins beside the carriage-mount holes.
         3DMAN 9x40mm clamp, single center hole. See ADR 0020. -->
    <circle cx="6" cy="65" r="2.25" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="44" cy="65" r="2.25" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- Scale bar for import verification: 100mm x 10mm -->
  <rect x="160" y="10" width="100" height="10" fill="none" stroke="#000000" stroke-width="0.1" />
  <text x="160" y="30" font-family="sans-serif" font-size="6" fill="#000000">100mm x 10mm scale bar</text>
</svg>
