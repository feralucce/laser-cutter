<svg xmlns="http://www.w3.org/2000/svg" width="280mm" height="140mm" viewBox="0 0 280 140">
  <!-- Floating gantry end plate (Y-axis carriage side). Two laminated layers. -->
  <!-- Inner layer: faces the beam/L-brackets. Wide flared opening (top) lets the
       40mm beam face slide in; two narrower slots below replicate the extrusion's
       T-slot channels so the bracket set screws have material to bite against.
       Outer layer: solid backing + shared carriage mount holes, no cutouts. -->
  <!-- Units: mm. 1 SVG user unit = 1mm. Cut lines only (no fill) for laser import. -->
  <!-- Working dims: bracket leg ~19-20mm, M5 set screw -- verify against actual
       hardware before cutting. Assumed material: 6mm ply/acrylic per layer. -->

  <!-- INNER LAYER -->
  <g transform="translate(10,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">Floating plate - INNER layer</text>
    <polygon fill="none" stroke="#000000" stroke-width="0.1" points="
      0,0 4.5,0 4.5,18 10,18 10,40 20,40 20,18 30,18 30,40 40,40 40,18 45.5,18 45.5,0
      50,0 50,95 0,95 0,0" />
    <!-- Carriage mount holes: M3 clearance, 20x20mm pattern -->
    <circle cx="15" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- OUTER LAYER (shared design, used for both fixed and floating plates) -->
  <g transform="translate(90,10)">
    <text x="0" y="-3" font-family="sans-serif" font-size="5" fill="#000000">Outer layer (shared, cut 2x)</text>
    <rect x="0" y="0" width="50" height="95" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="15" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
    <circle cx="35" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  </g>

  <!-- Scale bar for import verification: 100mm x 10mm -->
  <rect x="160" y="10" width="100" height="10" fill="none" stroke="#000000" stroke-width="0.1" />
  <text x="160" y="30" font-family="sans-serif" font-size="6" fill="#000000">100mm x 10mm scale bar</text>
</svg>
