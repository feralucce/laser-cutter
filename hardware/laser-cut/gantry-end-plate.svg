<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="120mm" viewBox="0 0 220 120">
  <!-- Gantry end plate: joins MGN12H carriage block (bottom) to 2040 gantry beam end (top). -->
  <!-- Units: mm. 1 SVG user unit = 1mm. Cut lines only (no fill) for laser import. -->

  <!-- Part outline: 50 x 90mm plate, 3mm corner radius -->
  <rect x="10" y="10" width="50" height="90" rx="3" ry="3"
        fill="none" stroke="#000000" stroke-width="0.1" />

  <!-- Extrusion T-slot mounting holes: M5 clearance (5.5mm dia), 20mm apart,
       aligned to 2040's two wide-face slots -->
  <circle cx="25" cy="30" r="2.75" fill="none" stroke="#000000" stroke-width="0.1" />
  <circle cx="45" cy="30" r="2.75" fill="none" stroke="#000000" stroke-width="0.1" />

  <!-- MGN12H carriage mounting holes: M3 clearance (3.5mm dia), 20x20mm square pattern -->
  <circle cx="25" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  <circle cx="45" cy="65" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  <circle cx="25" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />
  <circle cx="45" cy="85" r="1.75" fill="none" stroke="#000000" stroke-width="0.1" />

  <!-- Scale bar for import verification: 100mm x 10mm -->
  <rect x="90" y="10" width="100" height="10" fill="none" stroke="#000000" stroke-width="0.1" />
  <text x="90" y="30" font-family="sans-serif" font-size="6" fill="#000000">100mm x 10mm scale bar</text>
</svg>
