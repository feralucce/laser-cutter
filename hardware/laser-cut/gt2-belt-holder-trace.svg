       Downloads/Gt2 belt hoder - 6465304/files/gt2beltholder.stl
       - extracted programmatically from the raw mesh (same
       method as the other reference traces in this repo).
       Z-axis flipped for display so +Z (physical top per STL
       up convention) renders at the top of this drawing.

       Genuinely flat: 2.5mm thick uniform plate, profile lies
       in the X-Z plane (not X-Y like the other traced parts) -
       this part is a small vertical GT2 belt end-clamp, not a
       flat-on-the-bed plate.

       Body: 10mm wide x 20mm tall, rounded ends (5mm radius).
       Belt slot (top): 7mm wide x 2.5mm tall, rounded corners,
       centered ~4.84mm below the top edge on the centerline -
       the belt passes through here and gets pinched/clamped.
       Mounting hole (bottom): octagonal/near-circular, ~5.4mm
       across, centered ~5.6mm from the bottom edge on the
       centerline - for a screw into the carriage.

       Units: mm. 1 SVG unit = 1mm. Cut lines only, no fill. -->
