<svg xmlns="http://www.w3.org/2000/svg" width="130mm" height="100mm" viewBox="0 0 130 100">
  <!-- Direct 1:1 boundary trace of L_type.stl (V-slot corner
       connector), source file downloaded to the user's
       Downloads folder ("Corner connector for the V-slot -
       6103466"). Extracted programmatically from the raw mesh
       (same method as the other reference traces in this
       repo). Reference/cut-candidate, no ADR assigned yet.

       Genuinely flat: 3mm thick uniform plate, not a bent
       bracket. Triangular gusset shape, not a classic L shape
       - 60mm square with the far corner chamfered diagonally
       between (20,60) and (60,20). 5x diameter5mm mounting
       holes: one shared corner hole at (10,10), then 2 more
       per leg spaced 20mm apart - (10,30)/(10,50) up one leg,
       (30,10)/(50,10) along the other.

       Units: mm. 1 SVG unit = 1mm. Cut lines only, no fill. -->
  <path d="M 10.00,70.00 L 30.00,70.00 L 70.00,30.00 L 70.00,10.00 L 10.00,10.00 L 10.00,70.00 Z" fill="none" stroke="#000000" stroke-width="0.15" />
  <circle cx="20" cy="60" r="2.5" fill="none" stroke="#000000" stroke-width="0.15" />
  <circle cx="20" cy="40" r="2.5" fill="none" stroke="#000000" stroke-width="0.15" />
  <circle cx="20" cy="20" r="2.5" fill="none" stroke="#000000" stroke-width="0.15" />
  <circle cx="40" cy="20" r="2.5" fill="none" stroke="#000000" stroke-width="0.15" />
  <circle cx="60" cy="20" r="2.5" fill="none" stroke="#000000" stroke-width="0.15" />
  <!-- Scale bar for import verification: 100mm x 10mm -->
  <rect x="10" y="85" width="100" height="10" fill="none" stroke="#000000" stroke-width="0.1" />
  <text x="10" y="99" font-family="sans-serif" font-size="5" fill="#000000">100mm x 10mm scale bar</text>
</svg>